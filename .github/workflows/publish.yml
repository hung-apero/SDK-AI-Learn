name: Publish ai-speech

on:
  # Auto-publish when a release tag is pushed: e.g. `git tag v0.1.0 && git push --tags`.
  # The leading `v` is stripped; the rest becomes sdkVersion at build time.
  push:
    tags:
      - 'v*.*.*'

  # Manual override from the Actions tab — useful for ad-hoc snapshots or re-publishes.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (overrides sdkVersion in gradle.properties). Leave blank to use the committed value.'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Override version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Publishing version from tag: ${VERSION}"
          sed -i "s/^sdkVersion=.*/sdkVersion=${VERSION}/" gradle.properties
          grep '^sdkVersion=' gradle.properties

      - name: Override version from manual input
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          echo "Publishing version from manual input: ${{ inputs.version }}"
          sed -i "s/^sdkVersion=.*/sdkVersion=${{ inputs.version }}/" gradle.properties
          grep '^sdkVersion=' gradle.properties

      - name: Publish :ai-speech to Apero Artifactory
        env:
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        run: ./gradlew :ai-speech:publishMavenPublicationToMavenRepository --no-daemon --stacktrace
